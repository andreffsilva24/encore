services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: encore-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: encore-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafbat:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: encore-kafbat
    depends_on:
      - kafka
    ports:
      - "9000:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: true
      KAFKA_CLUSTERS_0_NAME: encore
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: encore-kafka-init
    depends_on:
      - kafka
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo 'Waiting for Kafka to be ready...'
      cub kafka-ready -b kafka:29092 1 30
      
      echo 'Creating topics...'
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic ticket.order.requested
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic ticket.seat.hold.requested
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic ticket.seat.held
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic ticket.seat.hold.failed
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic ticket.order.confirmed
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic ticket.order.cancelled
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic ticket.issued
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic ticket.events.dlq
      
      echo 'Topics created.'
      "

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: encore-api
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Kafka__BootstrapServers: kafka:29092
      OrderService__BaseUrl: http://order-service:8081

  order-db:
    image: postgres:16
    container_name: encore-order-db
    environment:
      POSTGRES_DB: encore_orders
      POSTGRES_USER: encore
      POSTGRES_PASSWORD: encore
    ports:
      - "5432:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: encore-order-service
    depends_on:
      - kafka
      - order-db
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/encore_orders
      SPRING_DATASOURCE_USERNAME: encore
      SPRING_DATASOURCE_PASSWORD: encore
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  redis:
    image: redis:7
    container_name: encore-redis
    ports:
      - "6379:6379"

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: encore-inventory-service
    depends_on:
      - kafka
      - redis
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  user-db:
    image: postgres:16
    container_name: encore-user-db
    environment:
      POSTGRES_DB: encore_users
      POSTGRES_USER: encore
      POSTGRES_PASSWORD: encore
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: encore-user-service
    depends_on:
      - user-db
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/encore_users
      SPRING_DATASOURCE_USERNAME: encore
      SPRING_DATASOURCE_PASSWORD: encore

volumes:
  order-db-data: {}
  user-db-data: {}